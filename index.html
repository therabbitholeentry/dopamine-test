<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026最新網路爆紅心理測驗：測驗你的戀愛腦/多巴胺指數！</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: space-between;
        }
        .lang-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 15px;
            box-sizing: border-box;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .game-container {
            max-width: 500px;
            width: 90%;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: auto;
            transition: opacity 0.4s ease;
        }
        h1 { font-size: 26px; margin-bottom: 10px; color: #ff477e; }
        .sub-title { font-size: 14px; color: #aaa; margin-bottom: 30px; }
        .question-text { font-size: 18px; line-height: 1.6; margin-bottom: 30px; min-height: 60px; }
        .btn-option {
            width: 100%;
            background: #ff477e;
            color: white;
            border: none;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-option:active { transform: scale(0.98); }
        .btn-option.secondary { background: #477eff; }
        .os-box {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #ff477e;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            font-style: italic;
            color: #ffb7ce;
            display: none;
        }
        .adsense-placeholder {
            width: 100%;
            max-width: 728px;
            height: 90px;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="lang-bar">
        <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">🌐 EN</button>
    </div>

    <div class="game-container" id="gameBox">
        <div id="startScreen">
            <div class="sub-title">秘兔局 ｜ The Rabbit Hole</div>
            <h1 id="tTitle">💔 多巴胺破產大檢測 💔</h1>
            <p class="question-text" id="tDesc">你每天花了多少時間在手機的時空黑洞裡？準備好接受理智的拷問了嗎？</p>
            <button class="btn-option" onclick="startTest()">開始檢測 / START</button>
        </div>
        <div id="quizScreen" style="display:none;">
            <div id="progress"
     style="margin-bottom:15px;color:#aaa;font-size:14px;">
        </div>
            <p class="question-text" id="qText"></p>
            <button class="btn-option" id="optA" onclick="choose(0)"></button>
            <button class="btn-option secondary" id="optB" onclick="choose(1)"></button>
            <div class="os-box" id="osBox"></div>
        </div>
    </div>

    <div class="adsense-placeholder">
        Sponsored / Google AdSense Advertisement Will Load Here
    </div>

    <script>
        let currentLang = 'zh';
let currentStep = 0;
let score = 0;
let answered = false;

const data = {
    zh: {
        questions: [
            { q: "早上鬧鐘響了，你本來只想拿手機關掉鬧鐘，結果不知不覺在床上躺著刷了 20 分鐘...", a: "【繼續刷】反正都遲到了，再看一部短影音就好。", b: "【痛苦放下】用盡全身力氣把手機扔到床尾，彈起來刷牙。", osA: "恭喜你！一天的開始就成功把大腦雙手奉獻給了多巴胺惡魔。", osB: "理智值＋10！雖然你的身體離開了床，但你的靈魂其實還留在脆（Threads）裡面。" },
            { q: "你只是想進廁所上個大號，但因為帶了手機進去，你感覺只過了 5 分鐘，一抬頭發現腿已經麻到站不起來了...", a: "【坐到腳麻】扶著牆壁慢慢站起來，一邊繼續看手機。", b: "【速戰速決】把手機放在洗手台上，上完立刻出來。", osA: "精緻窮的極致！你用健康的膝蓋換取了 30 分鐘無意義的快樂多巴胺。", osB: "理智值＋10！全台灣只有 5% 的人能抗拒在馬桶上刷短影音的魔力。" },
            { q: "晚上好不容易打開 Netflix 要看一部大片，結果只要劇情進入平淡期超過 10 秒，你的手就會不自覺地抓起桌上的手機開始刷...", a: "【雙管齊下】眼睛看電視，手裡刷手機，大腦同時接收雙倍多巴胺。", b: "【把手機藏起來】把手機反扣在沙發另一頭，強迫自己看電影。", osA: "多巴胺徹底破產！你現在的專注力已經比一條金魚還要短了。", osB: "理智值＋10！你正在跟現代科技進行一場史詩級的戒斷聖戰。" }
        ],
        results: [
            { title:"🧟 多巴胺喪屍", desc:"你的手已經不是你的手，而是演算法的延伸器官。" },
            { title:"🔥 重度成癮", desc:"你知道自己刷太久，但下一秒又打開短影音。" },
            { title:"🙂 一般人類", desc:"偶爾失控，但大致還保有自主意志。" },
            { title:"🦄 稀有清醒者", desc:"你居然能控制手機，而不是被手機控制。" }
        ]
    },

    en: {
        questions: [
            { q: "Your alarm goes off. You only unlocked your phone to turn it off, but now you’ve been doomscrolling in bed for 20 minutes...", a: "Keep scrolling", b: "Force stop", osA: "Your brain belongs to the algorithm.", osB: "Sanity +10." },
            { q: "Bathroom + phone = 5 minutes turns into 30...", a: "Stay", b: "Get out", osA: "Cooked.", osB: "Rare discipline." },
            { q: "Netflix becomes boring → phone instantly appears...", a: "Dual screen", b: "Hide phone", osA: "Attention destroyed.", osB: "Resistance achieved." }
        ],
        results: [
            { title:"🧟 Dopamine Zombie", desc:"Your hand is no longer yours." },
            { title:"🔥 Highly Addicted", desc:"You scroll more than you breathe." },
            { title:"🙂 Normal Human", desc:"Moderate control." },
            { title:"🦄 Rare Enlightened", desc:"You are free." }
        ]
    }
};


// 防連點
function choose(option) {
    if(answered) return;
    answered = true;

    let qList = data[currentLang].questions;
    let q = qList[currentStep];

    if(option === 1) score += 10;

    document.getElementById('osBox').innerText =
        option === 0 ? q.osA : q.osB;

    document.getElementById('osBox').style.display = 'block';

    document.getElementById('optA').disabled = true;
    document.getElementById('optB').disabled = true;

    setTimeout(() => {
        currentStep++;
        updateQuestion();

        document.getElementById('optA').disabled = false;
        document.getElementById('optB').disabled = false;
    }, 1200);
}


function updateQuestion() {
    let qList = data[currentLang].questions;

    if(currentStep >= qList.length) {
        showResult();
        return;
    }

    document.getElementById('progress').innerText =
        `${currentStep + 1} / ${qList.length}`;

    document.getElementById('qText').innerText = qList[currentStep].q;
    document.getElementById('optA').innerText = qList[currentStep].a;
    document.getElementById('optB').innerText = qList[currentStep].b;

    document.getElementById('osBox').style.display = 'none';
    answered = false;
}


function showResult() {
    let res = data[currentLang].results[
        Math.min(3, Math.floor(score / 10))
    ];

    document.getElementById('quizScreen').innerHTML = `
        <h1 id="resultTitle">${res.title}</h1>
        <p class="question-text">${res.desc}</p>
        <p>Score: ${score}/30</p>

        <button class="btn-option" onclick="shareResult()">
            分享結果
        </button>

        <button class="btn-option secondary" onclick="copyResult()">
            複製
        </button>

        <button class="btn-option" onclick="location.reload()">
            再測一次
        </button>
    `;
}


// 分享
function getShareText(title){
    return currentLang === 'zh'
        ? `我測出「${title}」！來測看看你的多巴胺指數👇`
        : `I got "${title}" on this test!`;
}

async function shareResult(){
    let title = document.getElementById('resultTitle').innerText;
    let text = getShareText(title);

    if(navigator.share){
        await navigator.share({
            title,
            text,
            url: location.href
        });
    } else {
        navigator.clipboard.writeText(text + "\n" + location.href);
        alert("已複製");
    }
}

function copyResult(){
    let title = document.getElementById('resultTitle').innerText;
    let text = getShareText(title);

    navigator.clipboard.writeText(text + "\n" + location.href);
    alert("已複製");
}
</body>
</html>
